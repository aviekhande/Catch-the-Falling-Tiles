name: catch_the_falling_tiles
description: "Catch the Falling Tiles — a small Flame arcade game."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.24.0
  flame_audio: ^2.12.2
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  get_it: ^9.2.1
  go_router: ^18.0.1
  dartz: ^0.10.1
  equatable: ^2.1.0
  shared_preferences: ^2.5.5
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/

